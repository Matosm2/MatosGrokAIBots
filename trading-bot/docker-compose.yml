services:
  trading-bot:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TRADING_MODE: ${TRADING_MODE:-paper}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
